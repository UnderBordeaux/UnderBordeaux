<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Bordeaux — Liens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --red: #E8000F; --bg: #141414; --border: #1e1e1e; --muted: #444; }

    body {
      background: var(--bg);
      font-family: 'Inter', Arial, sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .ub-redline { position: fixed; top: 0; left: 0; right: 0; height: 2px; background: var(--red); z-index: 10; }
    .ub-redline-bottom { position: fixed; bottom: 0; left: 0; right: 0; height: 2px; background: var(--red); z-index: 10; }

    .container { width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center; gap: 32px; }

    /* HEADER */
    .ub-header { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
    .ub-logo-img { width: 160px; height: auto; display: block; }
    .ub-name { font-family: Impact, Arial Black, sans-serif; font-size: 22px; letter-spacing: 2px; text-transform: uppercase; }
    .ub-name span { color: var(--red); }
    .ub-tagline { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }

    /* LIEN PRINCIPAL — horizontal pleine largeur */
    .ub-links-main { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .ub-link {
      display: flex; align-items: center; gap: 16px;
      padding: 16px 20px;
      background: #1a1a1a; border: 0.5px solid var(--border);
      text-decoration: none; color: #fff;
      transition: all 0.2s;
    }
    .ub-link:hover { border-color: var(--red); background: #1f1f1f; transform: translateY(-1px); }
    .ub-link.featured { border-left: 3px solid var(--red); }
    .ub-link-icon { width: 36px; height: 36px; background: var(--bg); border: 0.5px solid #2a2a2a; border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ub-link-icon svg { width: 18px; height: 18px; fill: var(--red); }
    .ub-link-info { flex: 1; }
    .ub-link-label { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
    .ub-link-name { font-size: 14px; font-weight: 600; color: #fff; }
    .ub-link-arrow { font-size: 14px; color: var(--muted); transition: color 0.2s; }
    .ub-link:hover .ub-link-arrow { color: var(--red); }

    /* GRILLE HORIZONTALE — réseaux sociaux */
    .ub-links-grid { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .ub-link-card {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      padding: 20px 16px;
      background: #1a1a1a; border: 0.5px solid var(--border);
      text-decoration: none; color: #fff;
      transition: all 0.2s; text-align: center;
    }
    .ub-link-card:hover { border-color: var(--red); background: #1f1f1f; transform: translateY(-1px); }
    .ub-link-card-icon { width: 44px; height: 44px; background: var(--bg); border: 0.5px solid #2a2a2a; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
    .ub-link-card-icon svg { width: 22px; height: 22px; fill: var(--red); }
    .ub-link-card-label { font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    .ub-link-card-name { font-size: 13px; font-weight: 600; color: #fff; }
    .ub-link-card:hover .ub-link-card-name { color: var(--red); }

    .ub-footer { font-size: 10px; color: #2a2a2a; letter-spacing: 0.1em; text-transform: uppercase; }
  </style>
</head>
<body>
