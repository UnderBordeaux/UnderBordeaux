<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Bordeaux</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --red: #E8000F; --bg: #0e0e0e; --border: #1e1e1e; --muted: #3a3a3a; }

    body {
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 20px 60px;
    }

    /* BARRE ROUGE TOP */
    .redline { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--red); z-index: 10; }

    /* HEADER */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 0 40px;
      gap: 12px;
    }
    .logo { width: 120px; height: auto; display: block; }
    .tagline {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* WRAPPER */
    .wrap { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; }

    /* LIEN SITE PRINCIPAL — grand, bien visible */
    .main-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 24px;
      background: var(--red);
      text-decoration: none;
      color: #fff;
      transition: opacity 0.2s;
    }
    .main-link:hover { opacity: 0.88; }
    .main-link-left { display: flex; flex-direction: column; gap: 3px; }
    .main-link-label { font-size: 9px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.75; }
    .main-link-name { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 26px; letter-spacing: 0.05em; }
    .main-link-arrow { font-size: 22px; opacity: 0.85; }

    /* SÉPARATEUR SECTION */
    .section-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 18px 0 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 0.5px;
      background: var(--border);
    }

    /* GRILLE RÉSEAUX */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px 16px;
      background: #141414;
      border: 0.5px solid var(--border);
      text-decoration: none;
      color: #fff;
      transition: all 0.2s;
    }
    .card:hover { border-color: var(--red); background: #181818; }

    .card-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-icon svg { width: 26px; height: 26px; fill: #fff; transition: fill 0.2s; }
    .card:hover .card-icon svg { fill: var(--red); }

    .card-name { font-size: 13px; font-weight: 600; color: #ccc; transition: color 0.2s; }
    .card:hover .card-name { color: #fff; }

    .card-handle { font-size: 10px; color: var(--muted); letter-spacing: 0.04em; }

    /* FOOTER */
    .footer {
      margin-top: 40px;
      font-size: 10px;
      color: #222;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
